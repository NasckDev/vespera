name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core (testes GdUnit4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Testes da lógica pura (sem Godot)
        run: dotnet test tests/Vespera.Tests.csproj --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: TestResults/*.trx

  godot:
    name: Godot (import, build e smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Baixar Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Configurar caminho do Godot
        run: echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Compilar solução
        run: dotnet build Vespera.sln -warnaserror

      - name: Importar assets
        run: timeout 600 "$GODOT" --headless --path . --import

      - name: Smoke test (joga o jogo sozinho)
        run: timeout 600 "$GODOT" --headless --path . -- --smoke-test
